<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail - Forum</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/" style="color: white;">Forum</a></h1>
            <nav id="nav-menu">
                <!-- Nav items will be injected by JS -->
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="alert-container"></div>
            
            <div id="post-detail-container">
                <p>Loading post...</p>
            </div>
            
            <div class="comments-section mt-2">
                <h3>Comments</h3>
                <div id="comments-list">
                    <p>Loading comments...</p>
                </div>
                
                <div id="comment-form-container" class="card mt-2" style="display: none;">
                    <h4>Add a Comment</h4>
                    <form id="comment-form">
                        <div class="form-group">
                            <label for="comment-content">Your Comment</label>
                            <textarea id="comment-content" class="form-control" rows="4" required minlength="1"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Post Comment</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Post Modal -->
    <div id="edit-post-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Post</h3>
                <button class="modal-close" onclick="closeModal('edit-post-modal')">&times;</button>
            </div>
            <form id="edit-post-form">
                <div class="form-group">
                    <label for="edit-post-title">Title</label>
                    <input type="text" id="edit-post-title" class="form-control" required minlength="3" maxlength="200">
                </div>
                <div class="form-group">
                    <label for="edit-post-content">Content</label>
                    <textarea id="edit-post-content" class="form-control" rows="8" required minlength="10"></textarea>
                </div>
                <div class="text-right">
                    <button type="button" class="btn btn-outline" onclick="closeModal('edit-post-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/post.js"></script>
</body>
</html>
